      <svg width="12" height="8" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1.5 L6 6.5 L11 1.5" fill="none" stroke="#6B655C" stroke-width="1.3"></path></svg>
    </button>
    <span class="hint" id="rowHint">左滑记录可删除</span>
  </div>
  <div id="list"></div>
</section>

<div id="picker" class="sheet-wrap" hidden>
  <div class="backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-label="选择年月">
    <div class="handle"></div>
    <h2>选择年月</h2>
    <div class="pick-years">
      <div class="chips" id="pickYears"></div>
      <div class="pick-sum" id="pickSum"></div>
    </div>
    <div class="months" id="pickMonths"></div>
  </div>
</div>

<div id="backup" class="sheet-wrap" hidden>
  <div class="backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-label="备份">
    <div class="handle"></div>
    <h2>备份</h2>
    <p class="status" id="syncStatus"></p>
    <label class="field">私有仓库
      <input id="repo" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="你的用户名/jingshi-data">
    </label>
    <label class="field">钥匙（Token）
      <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…">
    </label>
    <button id="saveSync" class="pill wide" type="button">保存并同步</button>
    <a class="guide-link" href="guide.html#backup">不会设置？看教程，可以交给 AI 一步步完成 ›</a>
    <div class="files">
      <button id="exportBtn" class="ghost" type="button">导出备份文件</button>
      <label class="ghost">导入备份文件<input id="importFile" type="file" accept="application/json,.json" hidden></label>
    </div>
    <p class="ver" id="ver"></p>
  </div>
</div>

<div id="askSheet" class="sheet-wrap" hidden>
  <div class="backdrop"></div>
  <div class="sheet" role="dialog" aria-labelledby="askTitle">
    <div class="handle"></div>
    <h2 id="askTitle">上次静心没有正常结束</h2>
    <p class="status" id="askText"></p>
    <button class="pill wide choice" id="askNow" type="button"></button>
    <button class="choice ghostish" id="askLeft" type="button"></button>
    <button class="choice plain" id="askDrop" type="button">这次不记</button>
  </div>
</div>

<div id="onboard" class="onboard" hidden>
  <svg class="ob-arrow" viewBox="0 0 110 130" aria-hidden="true">
    <defs><marker id="obh" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F2E3C4"></path></marker></defs>
    <path d="M14 122 C 30 70, 60 46, 92 14" fill="none" stroke="#F2E3C4" stroke-width="3.5" stroke-linecap="round" marker-end="url(#obh)"></path>
  </svg>
  <div class="ob-card" role="dialog" aria-labelledby="obTitle">
    <p class="ob-kicker">第一次来</p>
    <h2 id="obTitle">把静时收进微信浮窗</h2>
    <ol class="ob-steps">
      <li><span class="n">1</span><span>点右上角的「···」</span></li>
      <li><span class="n">2</span><span>在弹出的菜单里选「浮窗」</span></li>
      <li><span class="n">3</span><span>以后静心时，点微信侧边的小便签，就能回到静时</span></li>
    </ol>
    <button class="pill wide" id="obOk" type="button">我知道了</button>
    <a class="ob-more" id="obMore" href="guide.html">看图解和备份方法 ›</a>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

</body>
</html>
