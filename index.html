<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F2EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="静时">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<title>静时</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-180.png">
<link rel="preload" href="fonts/jost.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>

<main id="home" class="screen">
  <header class="bar">
    <img class="logo" src="icons/logo.svg" alt="静时">
    <button id="toRecords" class="tab" type="button">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 3.5h10M2 7h10M2 10.5h6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path></svg>
      <span>记录</span>
    </button>
  </header>
  <div class="ring">
    <svg width="264" height="264" viewBox="0 0 264 264" aria-hidden="true">
      <circle cx="132" cy="132" r="128" fill="none" stroke="#B8924F" stroke-width="1.5"></circle>
    </svg>
    <div class="ring-in">
      <div class="label">累计</div>
      <div class="total" id="total">
        <span class="num" id="totH">0</span><span class="unit">时</span>
        <span class="num" id="totM">00</span><span class="unit">分</span>
      </div>
    </div>
    <button id="result" class="result" type="button" hidden>
      <span class="result-k" id="resultK">本次静心</span>
      <span class="result-v num" id="resultV"></span>
      <span class="result-s" id="resultS"></span>
    </button>
  </div>
  <div class="cta"><button id="start" class="pill" type="button">开始静心</button></div>
  <footer class="today" id="today"></footer>
</main>

<section id="sit" class="sit" hidden aria-live="polite">
  <button class="count" id="count" type="button" aria-label="取消这次静心">
    <span class="count-n" id="countN">5</span>
    <span class="count-tip">再点一下取消</span>
  </button>
  <div class="core">
    <div class="breath" aria-hidden="true"></div>
    <div class="sit-title" id="sitTitle">进入静心</div>
  </div>
  <div class="sit-foot">
    <div class="sit-hint" id="sitHint">5 秒后进入静心状态
请不要离开此页面</div>
  </div>
</section>

<section id="records" class="screen" hidden>
  <header class="bar3">
    <button id="back" class="tab back" type="button">
      <svg width="8" height="14" viewBox="0 0 8 14" aria-hidden="true"><path d="M7 1 L1 7 L7 13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span>返回首页</span>
    </button>
    <button id="toBackup" class="tab backup" type="button">备份</button>
  </header>
  <h1 class="page-title">静心记录</h1>
  <div class="stats">
    <div class="stat"><span class="stat-k">累计</span><span class="stat-v"><span class="num" id="sH">0</span><small> 时 </small><span class="num" id="sM">00</span><small> 分</small></span></div>
    <div class="stat"><span class="stat-k">有效</span><span class="stat-v"><span class="num" id="sN">0</span><small> 次</small></span></div>
    <div class="stat"><span class="stat-k">已连续</span><span class="stat-v"><span class="num" id="sCur">0</span><small> 天</small></span><span class="stat-sub">最长连续 <span class="num" id="sLong">0</span> 天</span></div>
  </div>
  <div class="yearbar">
    <button id="yearBtn" class="yearbtn" type="button" aria-label="选择年月">
      <span class="num" id="yearLabel"></span>
      <svg width="12" height="8" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1.5 L6 6.5 L11 1.5" fill="none" stroke="#6B655C" stroke-width="1.3"></path></svg>
    </button>
    <span class="hint" id="rowHint">左滑记录可删除</span>
  </div>
  <div id="list"></div>
</section>

<div id="picker" class="sheet-wrap" hidden>
  <div class="backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-label="选择年月">
    <div class="handle"></div>
    <h2>选择年月</h2>
    <div class="pick-years">
      <div class="chips" id="pickYears"></div>
      <div class="pick-sum" id="pickSum"></div>
    </div>
    <div class="months" id="pickMonths"></div>
  </div>
</div>

<div id="backup" class="sheet-wrap" hidden>
  <div class="backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-label="备份">
    <div class="handle"></div>
    <h2>备份</h2>
    <p class="status" id="syncStatus"></p>
    <label class="field">私有仓库
      <input id="repo" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="你的用户名/jingshi-data">
    </label>
    <label class="field">钥匙（Token）
      <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…">
    </label>
    <button id="saveSync" class="pill wide" type="button">保存并同步</button>
    <a class="guide-link" href="guide.html#backup">不会设置？看教程，可以交给 AI 一步步完成 ›</a>
    <div class="files">
      <button id="exportBtn" class="ghost" type="button">导出备份文件</button>
      <label class="ghost">导入备份文件<input id="importFile" type="file" accept="application/json,.json" hidden></label>
    </div>
    <p class="ver" id="ver"></p>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

</body>
</html>
