<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E0D9CB">
<meta name="robots" content="noindex, nofollow">
<title>静时 · 呼吸效果预览</title>
<link rel="stylesheet" href="../css/app.css">
<style>
  html, body { background: var(--dim); }
  .tabs { position: fixed; top: calc(env(safe-area-inset-top) + 14px); left: 0; right: 0; z-index: 5; display: flex; justify-content: center; gap: 8px; }
  .tabs button { height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #CFC7B6; font-size: 13px; letter-spacing: 0.1em; color: var(--dim-ink); white-space: nowrap; }
  .tabs button.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .stage { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; }
  .stage.on { display: flex; }
  .core { position: relative; width: 260px; height: 260px; display: flex; align-items: center; justify-content: center; }
  .title { position: relative; font-size: 15px; letter-spacing: 0.5em; padding-left: 0.5em; color: var(--dim-ink); }
  .foot { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 24px); text-align: center; font-size: 12px; letter-spacing: 0.15em; line-height: 1.9; color: var(--dim-ink); }

  /* A：SVG 圆，每帧按新半径重画，线宽不变 */
  .orbit { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }

  /* B / C：柔光，没有硬边 */
  .glow {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle, rgba(196, 156, 92, 0.62) 0%, rgba(196, 156, 92, 0.34) 38%, rgba(196, 156, 92, 0.12) 58%, rgba(200, 164, 106, 0) 71%);
    animation: glow 10s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { transform: scale(0.78); opacity: 0.6; }
    50% { transform: scale(1.08); opacity: 1; }
  }
  .jing { position: relative; height: 92px; width: auto; }
  .sub { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 12px; letter-spacing: 0.5em; padding-left: 0.5em; color: var(--dim-ink); }
</style>

<nav class="tabs">
  <button type="button" data-v="a" class="on">A 细金圈</button>
  <button type="button" data-v="b">B 柔光</button>
  <button type="button" data-v="c">C 书法</button>
</nav>

      </circle>
    </svg>
    <div class="title">静心中</div>
  </div>
</section>

<script>
  document.querySelector('.tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    for (const x of document.querySelectorAll('.tabs button')) x.classList.toggle('on', x === b);
    for (const s of document.querySelectorAll('.stage')) s.classList.toggle('on', s.id === b.dataset.v);
  });
</script>
