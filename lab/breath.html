<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E0D9CB">
<meta name="robots" content="noindex, nofollow">
<title>静时 · 呼吸效果预览</title>
<link rel="stylesheet" href="../css/app.css">
<style>
  html, body { background: var(--dim); }
  .tabs { position: fixed; top: calc(env(safe-area-inset-top) + 14px); left: 0; right: 0; z-index: 5; display: flex; justify-content: center; gap: 8px; }
  .tabs button { height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #CFC7B6; font-size: 13px; letter-spacing: 0.1em; color: var(--dim-ink); white-space: nowrap; }
  .tabs button.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .stage { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; }
  .stage.on { display: flex; }
  .core { position: relative; width: 260px; height: 260px; display: flex; align-items: center; justify-content: center; }
  .title { position: relative; font-size: 15px; letter-spacing: 0.5em; padding-left: 0.5em; color: var(--ink); }
  .foot { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 24px); text-align: center; font-size: 12px; letter-spacing: 0.15em; line-height: 1.9; color: var(--dim-ink); }

  /* B 原版（太含蓄）：10 秒，幅度小 */
  .glow {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle, rgba(196, 156, 92, 0.62) 0%, rgba(196, 156, 92, 0.34) 38%, rgba(196, 156, 92, 0.12) 58%, rgba(196, 156, 92, 0) 71%);
    animation: glow 10s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { transform: scale(0.78); opacity: 0.6; }
    50% { transform: scale(1.08); opacity: 1; }
  }

  /* B+ 明显：8 秒，一团光大幅涨落 */
  .glow2 {
    position: absolute; left: -20px; top: -20px; width: 300px; height: 300px; border-radius: 50%;
    background: radial-gradient(circle, rgba(190, 146, 74, 0.80) 0%, rgba(190, 146, 74, 0.50) 32%, rgba(190, 146, 74, 0.18) 56%, rgba(190, 146, 74, 0) 70%);
    animation: glow2 8s ease-in-out infinite;
  }
  @keyframes glow2 {
    0%, 100% { transform: scale(0.58); opacity: 0.4; }
    50% { transform: scale(1.12); opacity: 1; }
  }

  /* B++ 更明显：里层光核 + 外层光晕，外层慢半拍 */
  .core-glow {
    position: absolute; left: 30px; top: 30px; width: 200px; height: 200px; border-radius: 50%;
    background: radial-gradient(circle, rgba(184, 140, 66, 0.90) 0%, rgba(184, 140, 66, 0.62) 40%, rgba(184, 140, 66, 0.20) 62%, rgba(184, 140, 66, 0) 72%);
    animation: core 8s ease-in-out infinite;
  }
  .halo {
    position: absolute; left: -50px; top: -50px; width: 360px; height: 360px; border-radius: 50%;
    background: radial-gradient(circle, rgba(196, 156, 92, 0.42) 0%, rgba(196, 156, 92, 0.22) 40%, rgba(196, 156, 92, 0.06) 60%, rgba(196, 156, 92, 0) 70%);
    animation: halo 8s ease-in-out infinite;
    animation-delay: -7.4s;
  }
  @keyframes core {
    0%, 100% { transform: scale(0.55); opacity: 0.5; }
    50% { transform: scale(1); opacity: 1; }
  }
  @keyframes halo {
    0%, 100% { transform: scale(0.62); opacity: 0.2; }
    50% { transform: scale(1.1); opacity: 1; }
  }
</style>
</head>
<body>
<nav class="tabs">
  <button type="button" data-v="b0">B 原版</button>
  <button type="button" data-v="b1" class="on">B+ 明显</button>
  <button type="button" data-v="b2">B++ 更明显</button>
</nav>

<section class="stage" id="b0">
  <div class="core">
    <div class="glow" aria-hidden="true"></div>
    <div class="title">静心中</div>
  </div>
</section>

<section class="stage on" id="b1">
  <div class="core">
    <div class="glow2" aria-hidden="true"></div>
    <div class="title">静心中</div>
  </div>
</section>

<section class="stage" id="b2">
  <div class="core">
    <div class="halo" aria-hidden="true"></div>
    <div class="core-glow" aria-hidden="true"></div>
    <div class="title">静心中</div>
  </div>
</section>

<div class="foot">请不要离开此页面<br>拿起手机或解锁即停止计时</div>

<script>
  document.querySelector('.tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    for (const x of document.querySelectorAll('.tabs button')) x.classList.toggle('on', x === b);
    for (const s of document.querySelectorAll('.stage')) s.classList.toggle('on', s.id === b.dataset.v);
  });
</script>
</body>
</html>
