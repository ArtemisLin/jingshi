<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E0D9CB">
<meta name="robots" content="noindex, nofollow">
<title>静时 · 呼吸效果预览</title>
<link rel="stylesheet" href="../css/app.css">
<style>
  html, body { background: var(--dim); }
  .tabs { position: fixed; top: calc(env(safe-area-inset-top) + 14px); left: 0; right: 0; z-index: 5; display: flex; justify-content: center; gap: 8px; }
  .tabs button { height: 36px; padding: 0 13px; border-radius: 18px; border: 1px solid #CFC7B6; font-size: 13px; letter-spacing: 0.1em; color: var(--dim-ink); white-space: nowrap; }
  .tabs button.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .stage { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; }
  .stage.on { display: flex; }
  .core { position: relative; width: 260px; height: 260px; display: flex; align-items: center; justify-content: center; }
  .title { position: relative; font-size: 15px; letter-spacing: 0.5em; padding-left: 0.5em; color: var(--ink); }
  .phrase { position: relative; height: 40px; width: auto; display: none; }
  .phrase.on { display: block; }
  .foot { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 24px); text-align: center; font-size: 12px; letter-spacing: 0.15em; line-height: 1.9; color: var(--dim-ink); }

  /* B++ 更明显：里层光核 + 外层光晕，外层慢半拍 */
  .core-glow {
    position: absolute; left: 30px; top: 30px; width: 200px; height: 200px; border-radius: 50%;
    background: radial-gradient(circle, rgba(184, 140, 66, 0.90) 0%, rgba(184, 140, 66, 0.62) 40%, rgba(184, 140, 66, 0.20) 62%, rgba(184, 140, 66, 0) 72%);
    animation: core 8s ease-in-out infinite;
  }
  .halo {
    position: absolute; left: -50px; top: -50px; width: 360px; height: 360px; border-radius: 50%;
    background: radial-gradient(circle, rgba(196, 156, 92, 0.42) 0%, rgba(196, 156, 92, 0.22) 40%, rgba(196, 156, 92, 0.06) 60%, rgba(196, 156, 92, 0) 70%);
    animation: halo 8s ease-in-out infinite;
    animation-delay: -7.4s;
  }
  @keyframes core {
    0%, 100% { transform: scale(0.55); opacity: 0.5; }
    50% { transform: scale(1); opacity: 1; }
  }
  @keyframes halo {
    0%, 100% { transform: scale(0.62); opacity: 0.2; }
    50% { transform: scale(1.1); opacity: 1; }
  }
</style>
</head>

</nav>

<div class="foot">请不要离开此页面<br>拿起手机或解锁即停止计时</div>

<script>
  document.querySelector('.tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    for (const x of document.querySelectorAll('.tabs button')) x.classList.toggle('on', x === b);
    for (const t of document.querySelectorAll('.phrase')) t.classList.toggle('on', t.id === 'f-' + b.dataset.f);
  });
</script>
