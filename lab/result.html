<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F2EA">
<meta name="robots" content="noindex, nofollow">
<title>静时 · 出定结果预览</title>
<link rel="stylesheet" href="../css/app.css">
<style>
  .tabs { display: flex; justify-content: center; gap: 8px; margin-top: 4px; }
  .tabs button { height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid var(--line); font-size: 13px; letter-spacing: 0.1em; white-space: nowrap; }
  .tabs button.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .sim { display: flex; justify-content: center; gap: 10px; margin-top: 18px; }
  .sim button { height: 40px; padding: 0 16px; border-radius: 20px; background: var(--cell); border: 1px solid var(--line); font-size: 13px; letter-spacing: 0.1em; white-space: nowrap; }

  .ring svg circle { transition: stroke 0.8s ease, stroke-width 0.8s ease; }
  .ring.lit svg circle { stroke: #C9A15A; stroke-width: 2.2; }

  /* 方案 A：累计生长 */
  .gain { position: absolute; left: 0; right: 0; top: 48px; text-align: center; font-size: 13px; letter-spacing: 0.12em; color: var(--gold-text); opacity: 0; transform: translateY(6px); transition: opacity 0.6s ease, transform 0.6s ease; }
  .gain .num { font-size: 15px; letter-spacing: 0.04em; }
  .gain.show { opacity: 1; transform: translateY(0); }
  .miss { position: absolute; left: 0; right: 0; bottom: 44px; display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 13px; letter-spacing: 0.1em; color: var(--muted); opacity: 0; transition: opacity 0.6s ease; }
  .miss .num { font-size: 15px; color: var(--ink); letter-spacing: 0.04em; }
  .miss.show { opacity: 1; }
  .seal {
    display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; box-sizing: border-box;
    border-radius: 3px; background: var(--red); color: #F8EFE6; font-size: 11px; line-height: 1.05; letter-spacing: 0; text-align: center;
    transform: rotate(-4deg);
  }
  .miss.show .seal { animation: stamp 0.45s cubic-bezier(0.2, 0.8, 0.3, 1.2) both; }
  @keyframes stamp { 0% { transform: rotate(-4deg) scale(1.8); opacity: 0; } 100% { transform: rotate(-4deg) scale(1); opacity: 1; } }

  /* 方案 B：圆内替换 */
  .swap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; opacity: 0; transition: opacity 0.7s ease; pointer-events: none; }
  .swap.show { opacity: 1; }
  .ring-in { transition: opacity 0.7s ease; }
  .ring-in.hide { opacity: 0; }
  .swap .num.big { font-size: 56px; font-weight: 300; line-height: 1; }
  .swap .num.big.bad { color: var(--red); }
  .swap .ok { font-size: 13px; letter-spacing: 0.2em; color: var(--gold-text); }
  .swap .no { display: flex; align-items: center; gap: 8px; font-size: 13px; letter-spacing: 0.1em; color: var(--muted); }
</style>
</head>
<body>
<main class="screen">
  <header class="bar">
    <img class="logo" src="../icons/logo.svg" alt="静时">
    <span class="tab" aria-hidden="true">记录</span>
  </header>
  <nav class="tabs">
    <button type="button" data-v="a" class="on">A 累计生长</button>
    <button type="button" data-v="b">B 圆内替换</button>
  </nav>
  <div class="ring" id="ring" style="margin-top: 36px">
    <svg width="264" height="264" viewBox="0 0 264 264" aria-hidden="true"><circle cx="132" cy="132" r="128" fill="none" stroke="#B8924F" stroke-width="1.5"></circle></svg>
    <div class="ring-in" id="ringIn">
      <div class="label">累计</div>
      <div class="total"><span class="num" id="h">37</span><span class="unit">时</span><span class="num" id="m" style="margin-left: 6px">42</span><span class="unit">分</span></div>
    </div>
    <div class="gain" id="gain">本次 <span class="num">+46′08″</span></div>
    <div class="miss" id="miss">本次 <span class="num">2′22″</span><span class="seal">不<br>计</span></div>
    <div class="swap" id="swap"></div>
  </div>
  <div class="sim">
    <button type="button" id="good">模拟：有效一次 46′08″</button>
    <button type="button" id="bad">模拟：不足五分半</button>
  </div>
  <div class="cta" style="min-height: 90px"><span class="pill" style="display: flex; align-items: center; justify-content: center">开始静心</span></div>
  <footer class="today"><div>今日 <span class="num" id="today">0′00″</span></div></footer>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let mode = 'a', total = 37 * 60 + 42, timers = [];
  const pad = (n) => String(n).padStart(2, '0');
  const show = (t) => { $('h').textContent = Math.floor(t / 60); $('m').textContent = pad(t % 60); };

  function reset() {
    timers.forEach(clearTimeout); timers = [];
    for (const id of ['gain', 'miss', 'swap']) $(id).classList.remove('show');
    $('ringIn').classList.remove('hide');
    $('ring').classList.remove('lit');
  }
  const later = (ms, fn) => timers.push(setTimeout(fn, ms));

  function countUp(from, to) {
    const t0 = performance.now(), dur = 1800;
    const step = (now) => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      show(Math.round(from + (to - from) * e));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  function good() {
    reset();
    const from = total; total += 46;
    $('today').textContent = '46′08″';
    if (mode === 'a') {
      $('ring').classList.add('lit');
      $('gain').classList.add('show');
      later(500, () => countUp(from, total));
      later(2600, () => $('ring').classList.remove('lit'));
      later(7000, () => $('gain').classList.remove('show'));
    } else {
      show(total);
      $('swap').innerHTML = '<div class="label">本次静心</div><div class="num big">46′08″</div><div class="ok">已计入累计</div>';
      $('ringIn').classList.add('hide'); $('swap').classList.add('show');
      later(6000, () => { $('swap').classList.remove('show'); $('ringIn').classList.remove('hide'); });
    }
  }

  function bad() {
    reset();
    if (mode === 'a') {
      $('miss').classList.add('show');
      later(7000, () => $('miss').classList.remove('show'));
    } else {
      $('swap').innerHTML = '<div class="label">本次</div><div class="num big bad">2′22″</div><div class="no"><span class="seal">不<br>计</span>不足五分半</div>';
      $('ringIn').classList.add('hide'); $('swap').classList.add('show');
      later(6000, () => { $('swap').classList.remove('show'); $('ringIn').classList.remove('hide'); });
    }
  }

  $('good').addEventListener('click', good);
  $('bad').addEventListener('click', bad);
  document.querySelector('.tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    mode = b.dataset.v;
    for (const x of document.querySelectorAll('.tabs button')) x.classList.toggle('on', x === b);
    reset(); show(total);
  });
</script>
</body>
</html>
